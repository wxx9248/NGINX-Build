name: Check for Updated Submodules and Trigger Build
on:
  schedule:
    - cron: '0 0 * * *' # every day at 00:00 UTC
  workflow_dispatch:

jobs:
  check-for-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Generate update summary
        id: summary
        run: |
          # Run the checker: it stages any changes and emits a markdown summary
          python ./script/updater/check-updates.py >summary.md

          # Expose the summary for the PR body
          echo "body <<EOF" >>$GITHUB_OUTPUT
          cat summary.md >>$GITHUB_OUTPUT
          echo "EOF" >>$GITHUB_OUTPUT

      - name: Detect changes
        run: |
          [[ "$(cat summary.md)" == "" ]] || echo "::set-output name=has_changes::true"
          rm summary.md || true
        id: detect_changes
        # Allow this step to "fail" without failing the job
        continue-on-error: true

      - name: Create Pull Request
        if: steps.detect_changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit-message: "GitHub Actions: Submodule Update"
          branch: actions/submodule-update
          branch-suffix: short-commit-hash
          title: "GitHub Actions: Submodule Update"
          body: ${{ steps.summary.outputs.body }}
          delete-branch: true
          assignees: |
            wxx9248
          reviewers: |
            wxx9248
        id: create_pr

      # Pull requests opened with GITHUB_TOKEN do not trigger pull_request workflows,
      # but workflow_dispatch is exempt. Dispatching on the PR branch makes the run's
      # GITHUB_SHA the PR head, so its checks attach to the PR and can gate the merge.
      - name: Build the update branch
        if: steps.detect_changes.outputs.has_changes == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build-docker-assembly.yaml --repo "${{ github.repository }}" --ref "${{ steps.create_pr.outputs.pull-request-branch }}"
